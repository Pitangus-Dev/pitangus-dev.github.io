name: Pitangus

# The site's own supply chain, checked with Pitangus: secrets, dependencies (OSV, including OpenSSF's malicious
# packages, MAL-*) and the workflows. On a pull request only what it introduces counts; the SARIF goes to code
# scanning.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  scan:
    name: Pitangus
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write   # upload the SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0              # history is needed to compare against the base
          persist-credentials: false
      - id: pitangus
        uses: Pitangus-Dev/pitangus@a4f863a7ff0785d4c33104dbeea1fc468b186936  # v0.15.1
        env:
          PITANGUS_DEFAULT_LOCALE: es
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        if: always() && steps.pitangus.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.pitangus.outputs.sarif }}
          category: pitangus
