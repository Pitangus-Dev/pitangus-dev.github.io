# Supply chain. The registry is the same as npm's; these settings decide what gets in:
# - versions published less than a week ago are not installed (a hijacked release is usually caught and pulled sooner);
# - a version that loses the trust (provenance or signature) its earlier versions had is refused, while it is less than
#   90 days old: a hijacked release is pulled long before that, and plenty of old ones were simply published by hand;
# - dependencies of dependencies can't come from git or tarball URLs;
# - dependencies' build scripts never run (the 2025 npm worms spread through them); a new one fails the install until
#   it is listed below on purpose.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 129600
blockExoticSubdeps: true
strictDepBuilds: true
ignoredBuiltDependencies:
  - esbuild   # its binary comes from an optional platform package; the script only checks it
  - fsevents  # macOS only, optional
  - workerd   # wrangler's local runtime (wrangler dev); deploying static assets doesn't use it

# Exceptions, each with its reason. Remove them once they no longer change the lockfile.
minimumReleaseAgeExclude:
  # 4.3.0 (2026-10-04) is the first release past GHSA-ch52-4w7c-c8xp, which covers up to 4.2.0 (the maintainer disputes
  # it). npm's lockfile already had 4.3.0, and the week's wait would bring back 4.2.0. Has no effect from 2026-10-11.
  - http-cache-semantics@4.3.0
overrides:
  # wrangler's miniflare pins sharp 0.35.4 exactly, which has GHSA-wq5f-xc86-pv6w (its bundled librsvg); 0.35.5 fixes it.
  'sharp@<0.35.5': 0.35.5
